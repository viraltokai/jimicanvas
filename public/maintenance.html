<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>JimmyAI Canvas · 站点已迁移</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,560;9..144,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg0: #f3efe6;
      --bg1: #e8e0d2;
      --ink: #1c1915;
      --muted: #5c554c;
      --accent: #c45c26;
      --accent-ink: #fffaf4;
      --line: rgba(28, 25, 21, 0.12);
      --card: rgba(255, 250, 244, 0.72);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Instrument Sans", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, #fff8ec 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #f0d9c4 0%, transparent 50%),
        linear-gradient(165deg, var(--bg0), var(--bg1));
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 32px 20px;
    }
    .shell {
      width: min(640px, 100%);
      border: 1px solid var(--line);
      background: var(--card);
      backdrop-filter: blur(10px);
      border-radius: 28px;
      padding: clamp(28px, 5vw, 48px);
      box-shadow: 0 30px 80px -48px rgba(28, 25, 21, 0.45);
      animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: none; }
    }
    .brand {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 18px;
    }
    h1 {
      font-family: Fraunces, Georgia, serif;
      font-size: clamp(2rem, 5vw, 2.75rem);
      line-height: 1.1;
      letter-spacing: -0.03em;
      margin: 0 0 14px;
      font-weight: 700;
    }
    .lead {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.65;
      max-width: 36em;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 22px;
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-ink);
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .cta:hover { transform: translateY(-1px); background: #a94b1c; }
    .cta svg { width: 18px; height: 18px; }
    .meta {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.6;
    }
    .meta code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.86em;
      background: rgba(28, 25, 21, 0.06);
      padding: 2px 7px;
      border-radius: 6px;
      color: var(--ink);
    }
  </style>
</head>
<body>
  <main class="shell">
    <p class="brand">JimmyAI Canvas</p>
    <h1>国内站点已迁移</h1>
    <p class="lead">
      本站（canvas.jimmyai.cn）已停止服务。请前往新画布地址继续创作，账号与项目数据已同步至新站点。
    </p>
    <a class="cta" href="https://canvas.viraltok.ai" rel="noopener noreferrer">
      前往 canvas.viraltok.ai
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
        <path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
    <div class="meta">
      新地址：<code>https://canvas.viraltok.ai</code><br />
      如遇登录或数据问题，请联系客服协助处理。
    </div>
  </main>
</body>
</html>
