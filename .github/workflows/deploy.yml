name: CD - Deploy JimiCanvas (Overseas)

on:
  push:
    branches:
      - main
      - master
      - overseas

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jimicanvas

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      image: ${{ steps.vars.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image vars
        id: vars
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${{ env.REGISTRY }}/${OWNER}/${{ env.IMAGE_NAME }}" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          echo "channel_tag=overseas" >> $GITHUB_OUTPUT
          echo "vite_api_url=https://canvas.viraltok.ai" >> $GITHUB_OUTPUT
          echo "vite_web_app_url=https://www.viraltok.ai" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            VITE_API_URL=${{ steps.vars.outputs.vite_api_url }}
            VITE_WEB_APP_URL=${{ steps.vars.outputs.vite_web_app_url }}
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.channel_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-overseas:
    name: Deploy to Overseas Server
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.AWS_DEPLOY_HOST }}
          username: ${{ secrets.AWS_DEPLOY_USER }}
          key: ${{ secrets.AWS_DEPLOY_SSH_KEY }}
          port: ${{ secrets.AWS_DEPLOY_PORT || 22 }}
          script: |
            cd /opt/project
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME || github.repository_owner }} --password-stdin
            export CANVAS_IMAGE=${{ needs.build-and-push.outputs.image }}:${{ needs.build-and-push.outputs.tag }}
            docker compose -f docker-compose.prod.yml pull canvas
            docker compose -f docker-compose.prod.yml up -d canvas
            docker image prune -f
