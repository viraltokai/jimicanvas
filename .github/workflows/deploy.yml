name: CD - Deploy JimiCanvas (Overseas)

on:
  push:
    branches:
      - main
      - master
      - overseas

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jimicanvas

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      image: ${{ steps.vars.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image vars
        id: vars
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${{ env.REGISTRY }}/${OWNER}/${{ env.IMAGE_NAME }}" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          echo "channel_tag=overseas" >> $GITHUB_OUTPUT
          echo "vite_api_url=https://canvas.viralwave.ai" >> $GITHUB_OUTPUT
          echo "vite_web_app_url=https://www.viralwave.ai" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            VITE_API_URL=${{ steps.vars.outputs.vite_api_url }}
            VITE_WEB_APP_URL=${{ steps.vars.outputs.vite_web_app_url }}
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.channel_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-overseas:
    name: Deploy to Overseas Server
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.AWS_DEPLOY_HOST }}
          username: ${{ secrets.AWS_DEPLOY_USER }}
          key: ${{ secrets.AWS_DEPLOY_SSH_KEY }}
          port: ${{ secrets.AWS_DEPLOY_PORT || 22 }}
          script: |
            cd /opt/project
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME || github.repository_owner }} --password-stdin
            export CANVAS_IMAGE=${{ needs.build-and-push.outputs.image }}:${{ needs.build-and-push.outputs.tag }}
            docker compose -f docker-compose.prod.yml pull canvas
            docker compose -f docker-compose.prod.yml up -d canvas
            docker image prune -f

  notify-telegram:
    name: Telegram Notify
    needs: [build-and-push, deploy-overseas]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID not set, skip notify"
            exit 0
          fi

          BUILD_RESULT="${{ needs.build-and-push.result }}"
          DEPLOY_RESULT="${{ needs.deploy-overseas.result }}"

          if [ "$BUILD_RESULT" = "success" ] && [ "$DEPLOY_RESULT" = "success" ]; then
            STATUS="✅ Success"
          else
            STATUS="❌ Failed"
          fi

          SHORT_SHA="${GITHUB_SHA::8}"
          COMMIT_MSG=$(echo '${{ github.event.head_commit.message }}' | head -n 1 | cut -c1-120)
          TEXT=$(cat <<EOF
          <b>CI/CD · jimicanvas</b>
          ${STATUS}

          <b>Repo</b>: ${{ github.repository }}
          <b>Branch</b>: ${{ github.ref_name }}
          <b>Commit</b>: <code>${SHORT_SHA}</code>
          <b>Author</b>: ${{ github.actor }}
          <b>Message</b>: ${COMMIT_MSG}

          <b>Jobs</b>
          · build: ${BUILD_RESULT}
          · deploy: ${DEPLOY_RESULT}

          <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View run</a>
          EOF
          )

          TEXT=$(printf '%s\n' "$TEXT" | sed 's/^[[:space:]]*//')

          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            >/dev/null
